services:
  producer:
    build:
      context: ..
      dockerfile: redisstream/Dockerfile
    environment:
      - USERNAME=CHANGEME
      - PASSWORD=CHANGEME
      - API_URL=https://api.example.com
      - TOKEN_REFRESH_INTERVAL_SECS=3600
      - OBJECT_REFRESH_INTERVAL_SECS=600
      - REDIS_ADDR=redis:6379
    restart: on-failure
  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
