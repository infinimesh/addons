services:
  server:
    build:
      context: ..
      dockerfile: rules/Dockerfile
    environment:
      - USERNAME=CHANGEME
      - PASSWORD=CHANGEME
      - API_URL=https://api.example.com
      - RULES_API_TOKEN=CHANGEME
      - RULES_WEBHOOK_SECRET=CHANGEME
      - RULES_MQTT_BROKER=tcp://mosquitto:1883
    volumes:
      - ./rules.example.yaml:/etc/infinimesh/rules.yaml:ro
      - alarms:/var/lib/infinimesh-rules
    ports:
      - "8080:8080"
    depends_on:
      - mosquitto
    restart: on-failure
  # Mosquitto without auth for trying it out. Delete this service and point
  # RULES_MQTT_BROKER at your own broker instead.
  mosquitto:
    image: eclipse-mosquitto:2
    command: ["mosquitto", "-c", "/mosquitto-no-auth.conf"]
    ports:
      - "1883:1883"
volumes:
  alarms:
