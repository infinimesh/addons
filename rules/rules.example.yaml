rules:
  # Raise when a pump runs hot, clear when it has cooled down.
  - name: pump-hot
    when: '"pump" in tags && reported.temp > 80'
    clear: reported.temp < 75
    cooldown: 10m
    repeat: 1h
    on_clear: true
    actions:
      - log: {message: "pump too hot"}
      - webhook: {url: "https://hooks.example.com/alarms", secret: "${RULES_WEBHOOK_SECRET}"}
      - mqtt: {topic: "infinimesh/alarms/{rule}/{device}", qos: 1}
      - desired: {fan: "on"}

  # Raise when any device in the "field" namespace goes offline.
  - name: offline
    when: ns == "field" && !connected
    cooldown: 5m
    actions:
      - log: {}
